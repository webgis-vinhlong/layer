name: Kiểm tra dữ liệu và mã nguồn

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Cài công cụ build
        run: npm ci

      - name: Tái tạo catalog và luồng GeoJSONL
        run: npm run build:data

      - name: Kiểm tra website và PMTiles
        run: npm run verify

      - name: Kiểm tra GeoJSONL bằng C++
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra native/geometry_sanity.cpp -o build/geometry_sanity
          build/geometry_sanity build/points.geojsonl build/lines.geojsonl build/polygons.geojsonl

      - name: Kiểm tra catalog bằng Rust
        run: |
          rustc -O native/catalog_audit.rs -o build/catalog_audit
          build/catalog_audit data/catalog.json

      - name: Kiểm tra PMTiles bằng Go
        run: go run native/pmtiles_inspect.go data/vinhlong-layers.pmtiles
